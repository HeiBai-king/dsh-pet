# ============================================================================
# dsh-pet —— DSH bundle patch
# ============================================================================
# 插件的「挂载声明」。DSH 启动时按 bundle 层栈叠加各插件 patch，
# 本文件把本插件插入当前 profile 的配置树。
#
# 这里**不用改**。里面没有任何绝对路径，换到哪台机器、装在哪个目录都一样。
# 真要改，只有一种情况：你把 package.json 里的 "name" 改了，那这里两处跟着改。
#
# 安装方式见 README。
# ============================================================================

- insert:
    - id: dsh-pet
      name: dsh-pet
